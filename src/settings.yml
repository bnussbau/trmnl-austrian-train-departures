---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.0
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://dbf.finalrewind.org/{{oebb_station}}.json?detailed=1&version=3&limit=15&admode=dep&hafas=%C3%96BB&platforms={{ platforms | url_encode }}
polling_headers: ''
polling_body: ''
id: 28271
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: oebb_station
  field_type: string
  name: OEBB Station
  description: Station ID (UIC) or the exact name of the station as used on https://fahrplan.oebb.at . Replace Spaces with %20
  placeholder: Wien%20Hbf or 8103000
  help_text: List of Station IDs https://docs.google.com/spreadsheets/d/1rLbK56tCZPaO0ppQFufzfGc7yOdrRsRBHUrRZsL7rFs
- keyname: platforms
  field_type: string
  optional: true
  name: Filter Platforms
  description: Optional. Comma separated, which platforms you'd like to show. By default all platforms are shown.
  placeholder: '1,2,3,4'
- keyname: walk_minutes
  field_type: number
  optional: true
  name: Walk Time (minutes)
  description: Minutes to add to the polling time before showing departures. Attention - This filters the retrieved departure list, so make sure you retrieve enough departures per poll.
  placeholder: '10'
- keyname: hide_metro
  field_type: boolean
  optional: true
  default: false
  name: Hide Metro Lines
  description: Hide Vienna metro departures (U1 through U6). This filters the retrieved departure list, so a metro-heavy stations can show fewer rows.
- keyname: doesnt_matter
  name: About This Plugin
  category: travel
  help_text: TRMNL X, TRMNL B/W/R/Y Ready
  description: Train departures for the Austrian OEBB. Data attribution dbf.finalrewind.org
  field_type: author_bio
  github_url: https://github.com/bnussbau/trmnl-austrian-train-departures
  email_address: trmnl@benjaminnussbaum.at
name: Austrian Train Departures (OEBB)
description: ÖBB Upcoming Train Departures
refresh_interval: 15
